repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # ensure lockfile is up to date
    rev: 0.11.7
    hooks:
      - id: uv-lock
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]